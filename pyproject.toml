[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ecomode-ai"
version = "0.1.0"
description = "Compact terminal output before sending it to AI coding agents."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Mario Lira" }]
keywords = ["cli", "ai", "tokens", "logs"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
ecomode = "ecomode:main"

[tool.setuptools]
py-modules = ["ecomode"]
